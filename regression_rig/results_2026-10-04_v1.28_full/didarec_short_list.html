o B which has its own saved draft → B's banner appears with NO leftover rows from A visible behind it.", "opt": false, "y": null, "ff": {"s": "auto", "e": "video A showing 2 cue rows; opened video B (which has its own draft) -> B's banner shown=True with 0 rows behind it"}, "cr": {"s": "auto", "e": "video A showing 3 cue rows; opened video B (which has its own draft) -> B's banner shown=True with 0 rows behind it"}}, {"id": "16.18", "t": "The sidecar hint line under the export buttons is visible and reads sensibly (the .vtt/.srt travels next to the video; captions are never burned into the video itself).", "opt": false, "y": null, "ff": {"s": "auto", "e": "hint line visible: 'Captions save as their own small file (.vtt or .srt) next to your video — the video itself is unchanged. Keep the two files in the same folder: course sites and video players find the captions automatically.'"}, "cr": {"s": "auto", "e": "hint line visible: 'Captions save as their own small file (.vtt or .srt) next to your video — the video itself is unchanged. Keep the two files in the same folder: course sites and video players find the captions automatically.'"}}]}, {"n": 17, "title": "Audio: mic, system audio, one-time no-audio hint", "items": [{"id": "17.1", "t": "Screen-share a window/tab and check \"Also share audio\" in Chrome's picker → recorded system audio is present in the saved file alongside mic audio (if mic is also on). Firefox cannot do this — skip there.", "opt": false, "y": "Y3", "ff": null, "cr": {"s": "auto", "e": "PROXY ONLY: a screen stream carrying an audio track (stand-in tone, mic off) lands in the saved file (audio RMS 0.139 in first second). Chrome's real 'Also share audio' checkbox and real system sound need the owner."}}, {"id": "17.2", "t": "Select a screen/window with NO audio (on Firefox, any screen — it never carries audio) → the one-time hint banner appears, styled CALMLY (info style, not the red/urgent error style).", "opt": false, "y": null, "ff": {"s": "auto", "e": "first audio-less screen -> banner shown with class 'error-banner visible info' (calm info style)"}, "cr": {"s": "auto", "e": "first audio-less screen -> banner shown with class 'error-banner visible info' (calm info style)"}}, {"id": "17.3", "t": "Chrome wording check: the hint mentions ticking \"Also share audio\" in the picker next time.", "opt": false, "y": null, "ff": null, "cr": {"s": "auto", "e": "wording: 'This screen share doesn't include sound. To record computer audio, tick \"Also share audio\" (or \"Share tab audio\") in the picker next time you choose a screen.'"}}, {"id": "17.4", "t": "Firefox wording check: loopback guidance mentioning a loopback input (Stereo Mix / VB-Audio Cable) as the selected microphone.", "opt": false, "y": null, "ff": {"s": "auto", "e": "wording: 'Heads up: this browser can't record your computer's sound — only your microphone. To include computer audio, set up a loopback input (like Stereo Mix or VB-Audio Cable) and choose it as your microphone.'"}, "cr": null}, {"id": "17.5", "t": "Fires ONCE ever per profile — select another audio-less screen afterward → it does NOT show again. Clear site data → the hint returns on the next audio-less selection.", "opt": false, "y": null, "ff": {"s": "auto", "e": "second audio-less selection: banner='' (silent); after clearing site storage it shows again: True"}, "cr": {"s": "auto", "e": "second audio-less selection: banner='' (silent); after clearing site storage it shows again: True"}}, {"id": "17.6", "t": "Dismiss the hint via its × close button → it closes cleanly.", "opt": false, "y": null, "ff": {"s": "auto", "e": "x clicked -> banner hidden (class 'error-banner')"}, "cr": {"s": "auto", "e": "x clicked -> banner hidden (class 'error-banner')"}}, {"id": "17.7", "t": "After the hint has shown (or been dismissed), trigger a genuine unrelated error (e.g. the caption-editor recording guard) → it displays in the NORMAL error style, not stuck looking like an info hint.", "opt": false, "y": null, "ff": {"s": "auto", "e": "after the hint, a genuine error ('Finish or stop the current recording before openin') shows with class 'error-banner visible' (normal error style)"}, "cr": {"s": "auto", "e": "after the hint, a genuine error ('Finish or stop the current recording before openin') shows with class 'error-banner visible' (normal error style)"}}, {"id": "17.8", "t": "Pause a no-audio recording, Change screen to a source WITH audio → the hint does NOT re-fire from the swap path (selectScreen is the only trigger — cross-check §5.6).", "opt": false, "y": null, "ff": null, "cr": {"s": "auto", "e": "hint still unused (flag=None); paused swap to an audio-less source -> no hint from the swap path (banner='', flag=None)"}}]}, {"n": 18, "title": "Misc UI: Screen-button meanings, error banner", "items": [{"id": "18.1", "t": "Four Screen-button click meanings, all in one pass: (1) dark + webcam OFF → opens the screen picker directly (no guard message); (2) LIT/actively streaming → toggles off (guard reverts if nothing else on); (3) dark + webcam ON → enters camera-only mode; (4) genuinely capturing with something else also active → toggling off simply disables the screen source.", "opt": false, "y": null, "ff": {"s": "auto", "e": "(1) dark+webcam off -> picker opened, no guard text: True; (2) lit, only source -> reverted with guard banner: True; (3) dark+webcam on -> camera-only, no picker: True; (4) capturing+webcam on -> screen source simply off: True"}, "cr": {"s": "auto", "e": "(1) dark+webcam off -> picker opened, no guard text: True; (2) lit, only source -> reverted with guard banner: True; (3) dark+webcam on -> camera-only, no picker: True; (4) capturing+webcam on -> screen source simply off: True"}}, {"id": "18.2", "t": "Cancel a Change Screen re-selection (mid-session, not paused) → button styling, Record button state, and preview canvas all fully resync to \"no stream\" (no stale selected styling, no falsely-enabled Record, no dead black canvas).", "opt": false, "y": null, "ff": {"s": "auto", "e": "cancelled re-selection: button reads 'Select Screen' (selected style=False), Record disabled=True, placeholder shown=True, Screen toggle lit=False; banner='Screen selection was cancelled. Click \"Select Screen\" to try again.'"}, "cr": {"s": "auto", "e": "cancelled re-selection: button reads 'Select Screen' (selected style=False), Record disabled=True, placeholder shown=True, Screen toggle lit=False; banner='Screen selection was cancelled. Click \"Select Screen\" to try again.'"}}, {"id": "18.3", "t": "Trigger any error (e.g. caption editor while recording) → the error banner has a × that dismisses it on click.", "opt": false, "y": null, "ff": {"s": "auto", "e": "error banner x clicked -> dismissed"}, "cr": {"s": "auto", "e": "error banner x clicked -> dismissed"}}, {"id": "18.4", "t": "After a cut + new take (armed continue-recording state), \"Undo re-record\" sits in its OWN row and the persistent recorder controls don't wrap to a second line. Eyeball/layout check.", "opt": false, "y": null, "ff": {"s": "auto", "e": "armed state at 1400px wide: 3 recorder buttons share one line (tops [728]); Undo re-record starts at y=824, below that row (bottom 764). Layout measured, not eyeballed."}, "cr": {"s": "auto", "e": "armed state at 1400px wide: 3 recorder buttons share one line (tops [726]); Undo re-record starts at y=819, below that row (bottom 760). Layout measured, not eyeballed."}}, {"id": "18.5", "t": "Doc spot-check (not functional): skim the README's feature list and \"System audio on Firefox\" section against what you just tested — flag anything that didn't match what you saw.", "opt": false, "y": null, "ff": {"s": "skipped", "e": "Not run."}, "cr": {"s": "skipped", "e": "Not run."}}]}], "yours": [{"id": "Y1", "b": ["ff", "cr"], "title": "One real recording, judged by ear", "do": "Mic on, share a window, record about a minute while talking. Pause once for a few seconds, resume, keep talking, then Stop & save and play it back.", "look": "Your voice sounds like you (not thin or phone-like). Lips and sound line up. No click or gap where you paused. While the Mic toggle is on, Windows shows the mic-in-use indicator.", "covers": ["2.2", "2.7", "3.2", "4.3"]}, {"id": "Y2", "b": ["ff", "cr"], "title": "Stop sharing from the browser's own bar", "do": "Start a recording, then end the share with the browser's \"Stop sharing\" control instead of the app's Stop button. Extra credit: do it after a paused Change screen.", "look": "The recording stops and you end up with a saved file. In Chrome a \"Recording stopped - ready to save\" banner appears and its Save recording button opens the save dialog (v1.27; you passed this on the local file on 2026-10-04, so this is a repeat on the hosted page).", "covers": ["5.7"]}, {"id": "Y3", "b": ["cr"], "title": "Chrome system audio", "do": "Share a tab or window with \"Also share audio\" ticked while something plays; record 15 seconds and save. Then: start a recording with mic off and no shared audio, pause, Change screen to a source with audio ticked.", "look": "First file contains the computer sound. Second case shows the gentle \"started without audio\" note and keeps recording.", "covers": ["17.1", "5.6"]}, {"id": "Y4", "b": ["ff", "cr"], "title": "Change screen to a differently shaped window", "do": "Record a full screen, pause, Change screen to a small or tall window, resume for a few seconds, save, and watch.", "look": "The stretched picture is acceptable to you. This is a judgment call only you can make; the mechanics passed.", "covers": ["5.8"]}, {"id": "Y5", "b": ["ff", "cr"], "title": "Recording with the tab in the background", "do": "Record something that moves (a video or a clock). Switch to another tab or minimise the browser for a minute, come back, save, and scrub through the hidden stretch.", "look": "The picture keeps moving through the hidden minute instead of freezing while the sound continues.", "covers": ["8.1", "8.2"]}, {"id": "Y6", "b": ["ff", "cr"], "title": "Real permission prompts", "do": "Clear site data, load the app, toggle Webcam and Mic on. In Chrome opened from a file (double-clicked index.html), toggle Mic off and on a few times.", "look": "No prompt on load. One prompt per device, then real device names. In file-Chrome only the first toggle-on asks; later ones don't nag.", "covers": ["1.5", "2.8"]}, {"id": "Y7", "b": ["ff"], "title": "Switch microphones in Firefox", "do": "Only if you have two mics: Mic on, pick the other one in the dropdown, record a few seconds.", "look": "The recording uses the newly chosen mic. Chrome was machine-checked; the test Firefox only had one fake mic. Optional extra: plug or unplug a device and see the dropdown update without a prompt.", "covers": ["2.4", "2.10"]}, {"id": "Y8", "b": ["ff"], "title": "Cancel Firefox's own Save-As dialog", "do": "With \"Always ask you where to save files\" on: record 10 seconds, Stop & save, cancel the Save-As dialog, click \"It didn't arrive\", reload.", "look": "The recovery banner comes back and Recover & save gives you the file. The in-app half of this was machine-checked; the native dialog needs a person.", "covers": ["12.3"]}, {"id": "Y9", "b": ["ff", "cr"], "title": "Drag a video into the caption editor", "do": "Open the caption editor and drag a .webm in from File Explorer. Add one caption and play across it.", "look": "The video opens, and the caption is drawn on the picture at the right moment.", "covers": ["16.2", "16.3"]}, {"id": "Y10", "b": ["ff", "cr"], "title": "One real crash", "do": "Record 15 seconds, end the browser from Task Manager, reopen, Continue recording for 10 more seconds, save, and watch across the join.", "look": "Banner appears; the saved file plays through the join without a multi-second freeze or silence. Tab-kill and browser-close were machine-checked; a hard process kill and your eyes on the seam were not.", "covers": ["10.1", "11.2"]}, {"id": "Y11", "b": ["ff"], "title": "Optional: watch memory while Firefox saves a long recording", "do": "Record 20 to 30 minutes at Best quality in your own Firefox. Open Task Manager, then Stop & save and watch Firefox's memory until the download bar appears. Afterwards click \"It's there - all set\", then try Record again straight away.", "look": "Memory stays roughly flat rather than climbing by a gigabyte or more. If Record has to wait, the status line says it is clearing out the last recording; note roughly how long the wait is. Both are findings below.", "covers": ["14.1", "14.3", "14.4"]}], "findings": [{"sev": "high", "where": "Firefox", "title": "OPEN - Saving a long recording spikes memory far past the file size", "body": "Checklist 14.1 and 14.3 expect memory to stay roughly flat while a long recording is prepared and saved. In the test Firefox it does not. Chrome's memory stays flat on the same recordings. Not fixed: it needs your confirmation on real Firefox first (Y11), and under Chrome-first it is fixed only if it is real and risks losing a recording.", "points": ["Re-run on v1.28, committed memory across the whole browser process tree: 30-minute recording, 363 MB file, 606 MB to a 2,424 MB peak (+1.8 GB); the save took 139 s.", "30-minute crash recovery, 368 MB file: 418 MB to a 2,710 MB peak (+2.3 GB); the save took 132 s.", "Chrome on the same run: memory fell by 51 MB while saving a 367 MB file.", "Playwright's Firefox 151 with the download captured by the test tool, so check it once on your Firefox 157 with Task Manager open (Y11). The files themselves were complete and seeked correctly."]}, {"sev": "med", "where": "Firefox", "title": "DOCUMENTED, NOT FIXED - A re-record point in the first seconds of a take can't be cut to", "body": "The cut code drops the whole first cluster of a take rather than cutting inside it. Chrome's first cluster is about a second; Firefox's is 7 to 9 seconds. Under Chrome-first this is described in the README rather than engineered around.", "points": ["First take: typing 0:07 on a 20 s recording brings up the \"start over - discard everything?\" prompt instead of cutting (item 15.4 fails as written). Typing 0:12 cuts correctly.", "Later take: a cut 3.5 s into the second take drops that whole take and lands 3.4 s early (extra check 15.14b).", "Past the first cluster, Firefox cuts are accurate to a quarter second."]}, {"sev": "med", "where": "Firefox", "title": "EXPLAINED in v1.28, WAIT REMAINS - Right after a big save is confirmed, Record waits", "body": "After clicking \"It's there - all set\" on a long recording, the app is still deleting the saved recording's stored pieces, and the next recording waits behind that. Since v1.28 the status line says so: \"Clearing out your last recording first - after a long recording this can take a few minutes. Recording will begin when it's done.\" The wait itself is unchanged (your decision: message only).", "points": ["Measured in the test Firefox on stored test data: 15 s at 75 MB; not started after 5 minutes at 375 MB. Real Firefox 157 not measured.", "In the full re-run, Record had not started 20 s after a real 363 MB save was confirmed, and the message was showing. That stopped the short follow-up clip (14.4) from running in Firefox."]}, {"sev": "low", "where": "Firefox, under load", "title": "OPEN, NOT REPRODUCED ALONE - Storage stalls were handled at load but not everywhere", "body": "When the rig ran five browsers at once, Firefox's storage stalled. The app showed its \"storage isn't responding\" message at load, as designed. But Record then sat on \"Starting...\" with no further message, and once a re-record click did nothing for 30 seconds. Neither happened when Firefox ran alone. No code change.", "points": []}, {"sev": "note", "where": "Checklist", "title": "OPEN - Three checklist lines no longer match the app", "body": "1.4: clicking Screen at load now opens the picker (v1.22.2); the guard message only appears from the lit state, which passed. 4.1: the preview stays live while paused; only the recorder pauses. 1.3: the Screen button is dark at load until a screen is selected (v1.21.3).", "points": []}, {"sev": "note", "where": "Chrome 154", "title": "FIXED in v1.26 - Chrome stored video frames in a form the app's indexing code skipped", "body": "Chrome 154 wrote each video frame as a BlockGroup because the compositor canvas carried a transparency channel; the app's duration, keyframe and cut-point code only reads SimpleBlocks. The canvas is now opaque, so Chrome writes SimpleBlocks again. You accepted this in real Chrome on 2026-10-04.", "points": ["Mic-off recordings now report their full length (item 9.4 passes) and cuts land where asked (asked for 0:08, kept 8.1 s).", "Seeking a 30-minute Chrome file: eight jumps, slowest 148 ms (580 ms before the fix).", "The one-frame black flash at the start of every Chrome take was fixed in the same version."]}, {"sev": "note", "where": "Chrome", "title": "FIXED in v1.27 - \"Stop sharing\" ended in \"Save failed\" instead of a save dialog", "body": "Chrome only opens a save dialog while the page is handling a click, and the browser's own Stop-sharing control gives the page none. The app now shows a \"Recording stopped - ready to save\" banner; its Save recording button opens the dialog. The same banner covers any stop the app triggers itself.", "points": ["You confirmed the original failure in real Chrome, then the fix on 2026-10-04: banner appeared, dialog opened, file played to the end.", "The rig's check (5.7b) passes on the fixed build and fails on the build before it.", "Not covered: a save in several parts whose second dialog opens after a long first write can still be refused."]}, {"sev": "note", "where": "Chrome", "title": "FIXED in v1.28 - Saving captions gave no visible confirmation", "body": "The saved and cancelled notes now also appear in the caption editor's own status line. Items 16.11 and 16.12 require it and pass. You checked both in real Chrome on 2026-10-04.", "points": []}, {"sev": "note", "where": "Both", "title": "FIXED in v1.28 - \"Kept m:ss\" read one second low on whole-second cuts", "body": "Typing 0:07 now reports \"Kept 0:07\" and a cut at 0:20 reports \"Kept 0:20\". You checked this in real Chrome on 2026-10-04.", "points": []}, {"sev": "note", "where": "README (18.5)", "title": "FIXED - Doc spot-check: two inaccuracies, one omission", "body": "The README's Chrome save description, the HTTPS requirement and the missing Mirror webcam entry were corrected on 2026-10-04.", "points": []}], "limits": ["These results are a full re-run on v1.28 (pushed 2026-10-04), one browser at a time. Chrome: 117 checks passed, none failed. Firefox: 105 passed; the 4 failures and the one unfinished scenario are the open Firefox items above.", "Chrome was your installed Chrome 154, driven by Playwright. Firefox was Playwright's own build, version 151, not your 157 and below the README's 153 floor.", "Camera and mic were the browsers' fake devices. The screen picker was replaced by a generated moving test pattern with a time code in it, which is how the content of every saved file could be verified frame by frame.", "Chrome's save dialog was replaced by a stand-in that writes through the same file API and enforces Chrome's click rule. Firefox downloads were real.", "Runs were headless, and a hidden tab could not be staged, so background-tab recording is on your list. Nothing was judged by ear or eye.", "The test rig is in the repo's regression_rig folder."], "extras": [{"id": "5.7b", "cr": {"s": "PASS", "e": "extra: capture ended by the browser with no click on the page (page had an active user gesture at that moment: False). The app showed the 'Recording stopped - ready to save' banner (error shown: ''); clicking Save recording produced the file (True); afterwards banner showing: False, error: ''"}, "ff": null}, {"id": "10.2b", "cr": {"s": "PASS", "e": "extra: after the confirmed recovery save a reload shows no banner (True); whole browser closed mid-recording and relaunched on the same profile -> banner=True, recovered 8.1s"}, "ff": {"s": "PASS", "e": "extra: after the confirmed recovery save a reload shows no banner (True); whole browser closed mid-recording and relaunched on the same profile -> banner=True, recovered 9.1s"}}, {"id": "11.4b", "cr": {"s": "PASS", "e": "extra: after the 3-segment save, reload shows no recovery banner=True"}, "ff": {"s": "PASS", "e": "extra: after the 3-segment save, reload shows no recovery banner=True"}}, {"id": "13.1L", "cr": {"s": "PASS", "e": "longer-file half of 13.1/13.2: 30.1-min file reports its total length and seeks (see 14.2)"}, "ff": {"s": "PASS", "e": "longer-file half of 13.1/13.2: 30.1-min file reports its total length and seeks (see 14.2)"}}, {"id": "14.1b", "cr": {"s": "PASS", "e": "extra: clicking Record for the long session took 0.1s to start recording"}, "ff": null}, {"id": "15.1b", "cr": {"s": "PASS", "e": "Stop & review clicked while PAUSED -> review pane shown=True, preview duration 9.2s"}, "ff": {"s": "PASS", "e": "Stop & review clicked while PAUSED -> review pane shown=True, preview duration 9.2s"}}, {"id": "15.3b", "cr": {"s": "PASS", "e": "extra: mic OFF (no audio), 14s recording, cut requested at 0:08 -> status 'Kept 0:08. S'; the saved file keeps about 8.0s of the original before the new take (0.0s from the requested point; the checklist's rule is 'within a second')"}, "ff": {"s": "PASS", "e": "extra: mic OFF (no audio), 14s recording, cut requested at 0:08 -> status 'Kept 0:08. S'; the saved file keeps about 8.0s of the original before the new take (0.0s from the requested point; the checklist's rule is 'within a second')"}}, {"id": "15.14b", "cr": {"s": "PASS", "e": "extra (same precision rule as 15.3): 2-segment chain, seam at 10.1s, cut requested at 13.6s (3.5s into the second take) -> status 'Kept 0:13. S'; saved file sequence [1, 2, 3], new take starts at 13.70s (0.1s from the requested point)"}, "ff": {"s": "FAIL", "e": "extra (same precision rule as 15.3): 2-segment chain, seam at 11.1s, cut requested at 14.6s (3.5s into the second take) -> status 'Kept 0:11. S'; saved file sequence [1, 3], new take starts at 11.20s (-3.4s from the requested point)"}}], "tally": {"auto": 209, "problem": 3, "yours": 11, "skipped": 7}, "longDone": true, "ledeExtra": " Chrome comes first: do the Chrome column in full, then Firefox as a smoke pass (Y1, Y8, Y10). Y11 is optional. Findings fixed since the first pass are marked FIXED below.", "baseline": "Build under test: v1.28 (ef7224e), full re-run.", "built": "2026-10-05 06:17"};
const KEY = "didarec-shortlist-v1";
const GLYPH = ["·", "✓", "✕"], WORD = ["untested", "pass", "FAIL"];
let st = { y: {} };
try { const raw = localStorage.getItem(KEY); if (raw) st = JSON.parse(raw) || st; } catch (e) {}
if (!st.y) st.y = {};
const rec = (id) => (st.y[id] = st.y[id] || { ff: 0, cr: 0, note: "" });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const LABEL = { auto: "checked ✓", problem: "problem", yours: "yours", skipped: "skipped" };

const t = DATA.tally;
document.getElementById("lede").textContent = "Each checklist item was run in a real Chrome and a real Firefox engine with fake devices, and every saved file was reopened and inspected. What is left for you is " + DATA.yours.length + " short tasks, most of them a single recording. Click FF or Cr on a task to mark it pass or fail; your marks stay in this browser." + (DATA.ledeExtra || "");
const tiles = document.getElementById("tiles");
for (const [cls, n, label] of [["good", t.auto, "browser checks passed by machine"], ["bad", t.problem, "checks that found a problem"], ["mine", DATA.yours.length, "tasks left for you"], ["", t.skipped, DATA.longDone ? "optional or not reproducible" : "still running (30-min recordings) or optional"]]) {
  const d = el("div", "tile " + cls); d.appendChild(el("b", null, String(n))); d.appendChild(el("span", null, label)); tiles.appendChild(d);
}

const ylist = document.getElementById("ylist");
for (const y of DATA.yours) {
  const card = el("div", "ycard"); const checks = el("div", "checks");
  for (const b of y.b) {
    const btn = el("button", "chk"); btn.dataset.b = b; btn.dataset.y = y.id;
    btn.appendChild(el("span", "g")); btn.appendChild(document.createTextNode(b === "ff" ? "FF" : "Cr"));
    btn.addEventListener("click", () => { const r = rec(y.id); r[b] = (r[b] + 1) % 3; save(); refresh(); });
    checks.appendChild(btn);
  }
  const body = el("div", "ybody");
  const title = el("div", "ytitle"); title.appendChild(el("span", "yid", y.id)); title.appendChild(document.createTextNode(y.title)); body.appendChild(title);
  const p1 = el("p"); p1.appendChild(el("span", "lab", "Do")); p1.appendChild(document.createTextNode(y.do)); body.appendChild(p1);
  const p2 = el("p"); p2.appendChild(el("span", "lab", "Look for")); p2.appendChild(document.createTextNode(y.look)); body.appendChild(p2);
  body.appendChild(el("div", "cov", "covers checklist " + y.covers.join(", ")));
  const nb = el("button", "notebtn", "add note"); const ta = el("textarea", "note"); ta.id = "note-" + y.id; ta.hidden = true; ta.setAttribute("aria-label", "Note for " + y.id);
  ta.value = rec(y.id).note || ""; if (ta.value.trim()) ta.hidden = false;
  nb.addEventListener("click", () => { ta.hidden = !ta.hidden; if (!ta.hidden) ta.focus(); });
  ta.addEventListener("input", () => { rec(y.id).note = ta.value; save(); nb.className = "notebtn" + (ta.value.trim() ? " has" : ""); nb.textContent = ta.value.trim() ? "note saved" : "add note"; });
  if (ta.value.trim()) { nb.className = "notebtn has"; nb.textContent = "note saved"; }
  body.appendChild(nb); body.appendChild(ta);
  card.appendChild(checks); card.appendChild(body); ylist.appendChild(card);
}

const flist = document.getElementById("flist");
for (const f of DATA.findings) {
  const d = el("div", "finding " + f.sev);
  const h = el("div", "ftitle"); h.appendChild(el("span", "tag", f.where)); h.appendChild(document.createTextNode(f.title)); d.appendChild(h);
  d.appendChild(el("p", null, f.body));
  if (f.points.length) { const ul = el("ul"); for (const p of f.points) ul.appendChild(el("li", null, p)); d.appendChild(ul); }
  flist.appendChild(d);
}
const lim = document.getElementById("limits"); for (const l of DATA.limits) lim.appendChild(el("li", null, l));

const seclist = document.getElementById("seclist");
function rowFor(id, text, opt, ff, cr, y) {
  const row = el("div", "row" + (opt ? " opt" : "")); const pills = el("div", "pills");
  for (const [b, r] of [["FF", ff], ["Cr", cr]]) { if (!r) continue; pills.appendChild(el("span", "pill " + r.s, b + " " + (LABEL[r.s] || r.s.toLowerCase()))); }
  const body = el("div", "rbody"); body.appendChild(el("span", "iid", id)); body.appendChild(document.createTextNode(text + (opt ? " (optional)" : "") + (y ? "  → " + y : "")));
  for (const [b, r] of [["FF", ff], ["Cr", cr]]) { if (!r) continue; const e = el("div", "ev"); e.appendChild(el("b", null, b)); e.appendChild(document.createTextNode(r.e)); body.appendChild(e); }
  row.appendChild(pills); row.appendChild(body); return row;
}
for (const s of DATA.sections) {
  const d = el("details", "card"); const sum = el("summary");
  let a = 0, p = 0, m = 0, k = 0;
  for (const it of s.items) for (const b of ["ff", "cr"]) { const r = it[b]; if (!r) continue; if (r.s === "auto") a++; else if (r.s === "problem") p++; else if (r.s === "yours") m++; else k++; }
  sum.appendChild(el("span", "snum", String(s.n))); sum.appendChild(el("span", "stitle", s.title));
  const c = el("span", "scount"); c.appendChild(document.createTextNode(a + " checked"));
  if (p) { c.appendChild(document.createTextNode(" · ")); c.appendChild(el("span", "bad", p + " problem" + (p > 1 ? "s" : ""))); }
  if (m) { c.appendChild(document.createTextNode(" · ")); c.appendChild(el("span", "mine", m + " yours")); }
  if (k) c.appendChild(document.createTextNode(" · " + k + " skipped"));
  sum.appendChild(c); d.appendChild(sum);
  for (const it of s.items) d.appendChild(rowFor(it.id, it.t, it.opt, it.ff, it.cr, it.y));
  if (p) d.open = true;
  seclist.appendChild(d);
}
if (DATA.extras.length) {
  const d = el("details", "card"); const sum = el("summary"); sum.appendChild(el("span", "snum", "+")); sum.appendChild(el("span", "stitle", "Extra checks added along the way")); d.appendChild(sum);
  const map = { PASS: "auto", FAIL: "problem", HUMAN: "yours", SKIP: "skipped", ERROR: "problem" };
  for (const x of DATA.extras) d.appendChild(rowFor(x.id, "", false, x.ff && { s: map[x.ff.s], e: x.ff.e }, x.cr && { s: map[x.cr.s], e: x.cr.e }, null));
  seclist.appendChild(d);
}
document.getElementById("foot").textContent = "Built " + DATA.built + ". " + (DATA.baseline || "Baseline: v1.25 + docs commits (a4402d8).") + " " + (DATA.longDone ? "Includes the 30-minute recordings." : "The 30-minute recordings (section 14) were still running when this was built.");

function refresh() {
  const tot = { ff: 0, cr: 0 }, pass = { ff: 0, cr: 0 }, fail = { ff: 0, cr: 0 };
  for (const y of DATA.yours) for (const b of y.b) { const v = rec(y.id)[b]; tot[b]++; if (v === 1) pass[b]++; if (v === 2) fail[b]++; }
  for (const btn of document.querySelectorAll(".chk")) {
    const v = rec(btn.dataset.y)[btn.dataset.b];
    btn.className = "chk" + (v ? " s" + v : ""); btn.querySelector(".g").textContent = GLYPH[v];
    btn.setAttribute("aria-label", (btn.dataset.b === "ff" ? "Firefox" : "Chrome") + " " + btn.dataset.y + ": " + WORD[v] + ". Click to change.");
  }
  for (const b of ["ff", "cr"]) {
    const bar = document.getElementById(b === "ff" ? "barFF" : "barCr");
    bar.querySelector(".p").style.width = (pass[b] / tot[b] * 100) + "%"; bar.querySelector(".f").style.width = (fail[b] / tot[b] * 100) + "%";
    document.getElementById(b === "ff" ? "cntFF" : "cntCr").textContent = (pass[b] + fail[b]) + "/" + tot[b];
  }
}
refresh();

document.getElementById("btnCopy").addEventListener("click", () => {
  const lines = ["# DidaRec #20 short list - owner results", "Generated " + new Date().toLocaleString(), ""];
  for (const y of DATA.yours) {
    const r = rec(y.id);
    lines.push(y.id + " " + y.title + " (checklist " + y.covers.join(", ") + "): " + y.b.map(b => (b === "ff" ? "FF " : "Cr ") + WORD[r[b]]).join(", "));
    if ((r.note || "").trim()) lines.push("   note: " + r.note.trim());
  }
  const text = lines.join("\n"); const toast = document.getElementById("toast");
  const done = (msg) => { toast.textContent = msg; setTimeout(() => { toast.textContent = ""; }, 2500); };
  navigator.clipboard.writeText(text).then(() => done("Copied"), () => {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); done("Select-all done; press Ctrl+C");
  });
});
</script>
